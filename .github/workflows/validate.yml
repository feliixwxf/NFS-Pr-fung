name: Website prüfen

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vercel- und Sites-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vercel-Build prüfen
        run: npm run build:vercel

      - name: Sites-Build prüfen
        run: npm run build
