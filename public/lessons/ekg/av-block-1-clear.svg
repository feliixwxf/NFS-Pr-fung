    <path id="beat" d="M0 180 H35 C43 180 45 163 55 163 C65 163 67 180 76 180 H125 L132 190 L140 112 L148 216 L158 180 H182 C194 180 198 153 214 153 C230 153 236 180 250 180 H270"/>
